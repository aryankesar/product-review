<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Desk · Flipkart sentiment</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏷️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Newsreader:ital,wght@0,400;0,500;1,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--mute:#5b6784;--paper:#eef1f6;--slip:#fff;--line:#d7dce8;--blue:#2874f0;--tape:#ffc93c;
--pos:#137a55;--posbg:#cdeedd;--neg:#c8344b;--negbg:#f8d3d9;--neu:#8a6a00;--neubg:#ffe9a8}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.1}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;margin-bottom:28px}
h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:800;letter-spacing:-.03em}
.sub{margin:6px 0 0;color:var(--mute);max-width:46ch}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:7px;align-items:center;font-size:.85rem;padding:5px 11px;border:1px solid var(--line);border-radius:99px;background:var(--slip)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--neg)}.chip.ok i{background:var(--pos)}
nav{display:flex;gap:26px;border-bottom:2px solid var(--line);margin-bottom:26px}
nav button{font:600 1rem "Bricolage Grotesque",sans-serif;background:none;border:0;padding:10px 0;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--blue)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
section[hidden]{display:none}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:24px;align-items:start}
@media(max-width:820px){.grid,.two{grid-template-columns:1fr!important}}
.slip{background:var(--slip);border-radius:3px;border-left:10px solid var(--tape);padding:18px 20px;box-shadow:0 1px 0 var(--line),0 12px 28px -18px rgba(20,33,61,.45)}
textarea{width:100%;min-height:190px;resize:vertical;border:0;background:none;font:400 1.2rem/1.6 Newsreader,Georgia,serif;color:var(--ink)}
textarea:focus-visible{outline-offset:6px}
.review{font:400 1.2rem/1.9 Newsreader,Georgia,serif;margin:0;white-space:pre-wrap}
mark{color:inherit;padding:0 2px;border-radius:2px}
mark.positive{background:linear-gradient(transparent 40%,var(--posbg) 40%)}
mark.negative{background:linear-gradient(transparent 40%,var(--negbg) 40%)}
mark.neutral{background:linear-gradient(transparent 40%,var(--neubg) 40%)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{font:600 1rem "Bricolage Grotesque",sans-serif;background:var(--blue);color:#fff;border:0;border-radius:6px;padding:11px 20px;cursor:pointer}
.btn:disabled{opacity:.55;cursor:progress}
.ex{font:.85rem "Instrument Sans";background:none;border:1px dashed var(--mute);border-radius:99px;padding:4px 11px;color:var(--mute);cursor:pointer}
.ex:hover{border-style:solid;color:var(--ink)}
.verdicts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.verdict{background:var(--slip);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.verdict small{color:var(--mute);display:block}
.stamp{display:inline-block;margin-top:6px;font:800 1.5rem "Bricolage Grotesque";border:3px solid;border-radius:6px;padding:0 10px;transform:rotate(-2.5deg)}
.positive{color:var(--pos)}.negative{color:var(--neg)}.neutral{color:var(--neu)}.mixed{color:var(--blue)}
.aspects{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.aspects li{display:grid;grid-template-columns:7.5rem 1fr;gap:12px;padding:9px 12px;background:var(--slip);border:1px solid var(--line);border-radius:6px}
.aspects b{text-transform:capitalize}.aspects span{color:var(--mute);font-family:Newsreader,serif;font-style:italic}
.note,.err{margin:14px 0 0;padding:10px 14px;border-radius:6px;font-size:.95rem}
.note{background:#e3ebfd}.err{background:var(--negbg);color:#7d1428}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.two h3{margin-bottom:8px}.two ul{margin:0;padding-left:1.2em}.two li{margin-bottom:6px}
.pro{border-top:4px solid var(--pos)}.con{border-top:4px solid var(--neg)}
.big{font:500 1.4rem/1.45 Newsreader,serif}
input[type=text]{width:100%;font:1.1rem "Instrument Sans";padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--slip)}
.bar{display:grid;grid-template-columns:5.5rem 1fr 4rem;gap:12px;align-items:center;margin:9px 0}
.bar div div{height:14px;border-radius:3px}
.fig{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.fig img{width:100%;border-radius:6px;border:1px solid var(--line)}
@media(max-width:560px){.verdicts,.fig{grid-template-columns:1fr}}
@media(prefers-reduced-motion:no-preference){.stamp{animation:stamp .25s ease-out}@keyframes stamp{from{transform:scale(1.5) rotate(-6deg);opacity:0}}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Review Desk</h1><p class="sub">Paste a Flipkart review. A trained SVM and an LLM both read it, and the LLM shows where it found each opinion.</p></div>
  <div class="chips" id="chips" aria-live="polite"></div>
</header>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-tab="analyze">Analyze a review</button>
  <button role="tab" aria-selected="false" data-tab="summary">Summarize a product</button>
  <button role="tab" aria-selected="false" data-tab="report">Model report</button>
</nav>

<section id="analyze"><div class="grid">
  <div>
    <div class="slip"><label for="review" class="sr" style="position:absolute;left:-9999px">Review text</label>
    <textarea id="review" maxlength="2000" placeholder="Paste a review here…"></textarea></div>
    <div class="row"><button class="btn" id="go">Analyze review</button>
      <button class="ex" data-ex="Battery lasts 12 hours and sound is crisp, but the cable is too short.">Mixed</button>
      <button class="ex" data-ex="Nice. Not bad for the price, delivery was quick.">Not bad</button>
      <button class="ex" data-ex="Worst product. Stopped working in two days and the seller refused a refund.">Complaint</button></div>
  </div>
  <div id="aout"><p class="note">Results appear here. Try one of the example reviews to start.</p></div>
</div></section>

<section id="summary" hidden>
  <label for="prod" style="font:600 1.1rem 'Bricolage Grotesque'">Which product?</label>
  <div class="row" style="margin-top:8px"><input type="text" id="prod" list="plist" placeholder="e.g. electric kettle" autocomplete="off" style="flex:1;min-width:220px">
  <datalist id="plist"></datalist><button class="btn" id="sgo">Summarize reviews</button></div>
  <div id="sout"></div>
</section>

<section id="report" hidden><div id="rout"><p class="note">Loading…</p></div></section>
</div>

<script>
const $=s=>document.querySelector(s), el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
async function api(url,body){
  const r=await fetch(url,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{});
  const j=await r.json().catch(()=>({error:"The server sent an unreadable reply."}));
  if(!r.ok)throw new Error(j.error||"Request failed.");return j;
}
const msg=(box,text,cls="err")=>{box.replaceChildren(el("p",cls,text))};
const stamp=(label,cls)=>el("span","stamp "+cls,label);

/* tabs */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
  document.querySelectorAll("section").forEach(s=>s.hidden=s.id!==b.dataset.tab);
  if(b.dataset.tab==="report")loadReport();
});

/* status chips */
api("/api/status").then(s=>{
  const c=(ok,t)=>{const e=el("span","chip"+(ok?" ok":""));e.append(el("i"),t);return e};
  $("#chips").append(c(s.svm_ready,s.svm_ready?"SVM ready":"SVM not trained"),
    c(s.llm_ready,s.llm_ready?`${s.provider} · ${s.model}`:"LLM key missing"));
}).catch(()=>{});

/* analyze */
document.querySelectorAll(".ex").forEach(b=>b.onclick=()=>{$("#review").value=b.dataset.ex;$("#review").focus()});
function highlighted(text,aspects){
  const low=text.toLowerCase(),r=[];
  aspects.forEach(a=>{const i=low.indexOf(a.evidence.toLowerCase());if(a.evidence&&i>=0)r.push([i,i+a.evidence.length,a.sentiment])});
  r.sort((a,b)=>a[0]-b[0]);
  const p=el("p","review");let pos=0;
  r.forEach(([s,e,k])=>{if(s<pos)return;p.append(text.slice(pos,s));p.append(Object.assign(el("mark",k,text.slice(s,e))));pos=e});
  p.append(text.slice(pos));return p;
}
$("#go").onclick=async()=>{
  const text=$("#review").value.trim(),box=$("#aout"),btn=$("#go");
  if(!text)return msg(box,"Write or paste a review first.");
  btn.disabled=true;btn.textContent="Reading…";
  try{
    const d=await api("/api/analyze",{text}),L=d.llm;
    const v=el("div","verdicts"),a=el("div","verdict"),b=el("div","verdict");
    a.append(el("small",null,"Trained model (SVM)"),d.svm?stamp(d.svm,d.svm.toLowerCase()):el("p",null,"Not trained. Run python main.py train."));
    b.append(el("small",null,"LLM overall"),L?stamp(L.overall,L.overall):el("p",null,"Unavailable"));
    v.append(a,b);const out=[v];
    if(d.llm_error)out.push(el("p","err",d.llm_error));
    if(L){
      if(L.one_line_summary)out.push(el("p","big",L.one_line_summary));
      const slip=el("div","slip");slip.append(highlighted(text,L.aspects));slip.style.marginTop="14px";out.push(slip);
      const ul=el("ul","aspects");
      L.aspects.forEach(x=>{const li=el("li");const k=el("b","",x.aspect);k.classList.add(x.sentiment);li.append(k,el("span",null,"“"+x.evidence+"”"));ul.append(li)});
      out.push(L.aspects.length?ul:el("p","note","No specific product aspects were mentioned."));
    }
    box.replaceChildren(...out);
  }catch(e){msg(box,e.message)}
  btn.disabled=false;btn.textContent="Analyze review";
};

/* summarize */
let t;$("#prod").oninput=e=>{clearTimeout(t);t=setTimeout(async()=>{
  try{const l=await api("/api/products?q="+encodeURIComponent(e.target.value));
  $("#plist").replaceChildren(...l.map(p=>Object.assign(el("option"),{value:p.name,label:p.reviews+" reviews"})))}catch{}},250)};
$("#sgo").onclick=async()=>{
  const box=$("#sout"),btn=$("#sgo"),product=$("#prod").value.trim();
  if(!product)return msg(box,"Type a product name first.");
  btn.disabled=true;btn.textContent="Reading reviews…";
  try{
    const d=await api("/api/summarize",{product});
    const list=(title,cls,items)=>{const c=el("div","slip "+cls);c.append(el("h3",null,title));const u=el("ul");items.forEach(i=>u.append(el("li",null,i)));if(!items.length)u.append(el("li",null,"None found"));c.append(u);return c};
    const two=el("div","two");two.append(list("What people like","pro",d.pros),list("What people dislike","con",d.cons));
    box.replaceChildren(el("h2",null,d.product),el("p","note",`Based on ${d.reviews} reviews, sampled across all sentiments.`),
      el("p","big",d.verdict),two,el("p","big",d.recommendation));
    box.firstChild.style.margin="22px 0 4px";
  }catch(e){msg(box,e.message)}
  btn.disabled=false;btn.textContent="Summarize reviews";
};

/* report */
let loaded=false;
async function loadReport(){
  if(loaded)return;const box=$("#rout");
  try{
    const d=await api("/api/report"),tot=Object.values(d.sentiment).reduce((a,b)=>a+b,0),col={Positive:"--pos",Neutral:"--tape",Negative:"--neg"};
    const out=[el("h2",null,`${d.reviews.toLocaleString()} unique reviews`)];
    Object.entries(d.sentiment).forEach(([k,n])=>{
      const r=el("div","bar"),w=el("div"),f=el("div");f.style.cssText=`width:${n/tot*100}%;background:var(${col[k]})`;w.append(f);
      r.append(el("span",null,k),w,el("span",null,(n/tot*100).toFixed(1)+"%"));out.push(r)});
    if(d.benchmark.svm){
      out.push(el("h2",null,"SVM vs LLM on held-out reviews"));
      const two=el("div","two");
      ["svm","llm"].forEach(k=>{const b=d.benchmark[k],c=el("div","verdict");
        c.append(el("small",null,k.toUpperCase()+" accuracy · 95% CI "+b.low+"–"+b.high),el("span","big",(b.accuracy*100).toFixed(1)+"%"));two.append(c)});
      out.push(two,el("p","note","The star rating is the “truth” here, and the SVM was trained on it. Where the LLM disagrees, it is judging the text, so it is not always wrong."));
    }
    const fig=el("div","fig");["wordcloud_positive.png","wordcloud_negative.png"].forEach(n=>{const i=el("img");i.src="/figures/"+n;i.alt=n.includes("pos")?"Word cloud of positive reviews":"Word cloud of negative reviews";fig.append(i)});
    out.push(fig);box.replaceChildren(...out);box.querySelectorAll("h2").forEach((h,i)=>h.style.margin=i?"28px 0 8px":"0 0 14px");loaded=true;
  }catch(e){msg(box,e.message)}
}
</script>
</body>
</html>
